# Spring Boot Application Configuration

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Database Configuration (PostgreSQL as default)
# Environment variables can be set in .env file or system environment
# Uses same DB variables as quarkus-bamoe-app for consistency
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enquiry-db}
spring.datasource.username=${DB_USER:quarkus}
spring.datasource.password=${DB_PASSWORD:quarkus}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Console (disabled by default, enable for development if needed)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Disable SQL initialization - Flyway handles this
spring.sql.init.mode=never

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# OAuth2 Provider Type (optional - generic converter handles both)
# Possible values: keycloak, azure, or leave empty for auto-detection
spring.security.oauth2.idp.type=keycloak

# Application security settings
app.security.enabled=true

# OIDC Configuration - Uses environment variables from .env file
# Required environment variables:
#   - OIDC_AUTH_SERVER_URL (e.g., http://localhost:9180/realms/quarkus-realm)
#   - OIDC_CLIENT_ID (e.g., spring-boot-api)
#   - OIDC_CLIENT_SECRET (e.g., spring-boot-secret)
#   - OAUTH_SCOPE (e.g., openid profile email)

# OIDC Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_AUTH_SERVER_URL}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_AUTH_SERVER_URL}/protocol/openid-connect/certs
# spring.security.oauth2.resourceserver.jwt.audiences=account

# For outbound service-to-service calls (uncomment if needed)
# spring.security.oauth2.client.registration.oidc.client-id=${OIDC_CLIENT_ID}
# spring.security.oauth2.client.registration.oidc.client-secret=${OIDC_CLIENT_SECRET}
# spring.security.oauth2.client.registration.oidc.authorization-grant-type=client_credentials
# spring.security.oauth2.client.registration.oidc.scope=${OAUTH_SCOPE:openid profile email}
# spring.security.oauth2.client.provider.oidc.issuer-uri=${OIDC_AUTH_SERVER_URL}
# spring.security.oauth2.client.provider.oidc.token-uri=${OIDC_AUTH_SERVER_URL}/protocol/openid-connect/token

# Logging Configuration
logging.level.com.example.springboot=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.boot.web.servlet=WARN

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# OpenAPI Server Configuration (comma-separated lists)
# URLs and descriptions should have same number of items
openapi.servers.urls=
openapi.servers.descriptions=