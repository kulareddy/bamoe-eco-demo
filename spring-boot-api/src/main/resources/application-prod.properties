# Production Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:springbootapi}
spring.datasource.username=${DB_USER:springbootapi}
spring.datasource.password=${DB_PASSWORD:Ch@ngeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production Server Configuration
server.port=8080

# JPA/Hibernate Configuration for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Flyway Configuration for Production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# OAuth2 Provider Type (optional - generic converter handles both)
# Possible values: keycloak, azure, or leave empty for auto-detection
spring.security.oauth2.idp.type=azure

# OIDC Configuration for Production - Uses environment variables from .env file
# For Azure Entra ID (default prod):
#   - OIDC_AUTH_SERVER_URL=https://login.microsoftonline.com/{tenant-id}/v2.0
#   - OIDC_CLIENT_ID={client-id}
#   - OIDC_CLIENT_SECRET={client-secret}
#   - OAUTH_SCOPE=openid profile email
# For Keycloak:
#   - OIDC_AUTH_SERVER_URL=https://your-keycloak.com/realms/{realm}
#   - OIDC_CLIENT_ID={client-id}
#   - OIDC_CLIENT_SECRET={client-secret}
#   - OAUTH_SCOPE=openid profile email

# OIDC Discovery and JWT Configuration (Spring Boot Resource Server)
# Equivalent to Quarkus: %prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_AUTH_SERVER_URL:https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0}

# JWK Set URI is automatically constructed from auth-server-url
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_AUTH_SERVER_URL:https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0}/discovery/v2.0/keys

# Client credentials support for outbound calls (uncomment if needed)
# spring.security.oauth2.client.registration.oidc.client-id=${OIDC_CLIENT_ID}
# spring.security.oauth2.client.registration.oidc.client-secret=${OIDC_CLIENT_SECRET}
# spring.security.oauth2.client.registration.oidc.authorization-grant-type=client_credentials
# spring.security.oauth2.client.registration.oidc.scope=${OAUTH_SCOPE:openid profile email}
# spring.security.oauth2.client.provider.oidc.issuer-uri=${OIDC_AUTH_SERVER_URL:https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0}
# spring.security.oauth2.client.provider.oidc.token-uri=${OIDC_AUTH_SERVER_URL:https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0}/oauth2/v2.0/token

# Equivalent to Quarkus: %prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:quarkus-bamoe-app}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_CLIENT_ID:api://${AZURE_CLIENT_ID}}

