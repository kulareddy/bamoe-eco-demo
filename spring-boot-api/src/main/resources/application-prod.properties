# Actuator Configuration - Limited exposure for production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized

# Production Logging Configuration
logging.level.com.example.springboot=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# Production OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Production OpenAPI Server Configuration
openapi.servers.urls=https://staging-api.example.com,https://api.example.com
openapi.servers.descriptions=Staging Environment,Production Environment