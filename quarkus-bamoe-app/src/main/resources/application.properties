#####################################
# Persistence settings
#####################################
%dev.kie.flyway.enabled=true
%prod.kie.flyway.enabled=false
kogito.persistence.type=jdbc
kogito.persistence.optimistic.lock=true
kogito.persistence.proto.marshaller=false

# Database configuration - Uses environment variables from .env file
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:quarkus}
quarkus.datasource.password=${DB_PASSWORD:quarkus}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enquiry-process}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enquiry-process}

# Disabling Hibernate schema generation
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.validate-in-dev-mode=false

#####################################
# Transactions support
#####################################
kogito.transactionEnabled=true

#####################################
# Jobs Service configuration
#####################################
kogito.jobs-service.url=http://localhost:${quarkus.http.port}
kogito.jobs-service.management.heartbeat.management-id=${quarkus.application.name}
kogito.jobs-service.loadJobIntervalInMinutes=1
kogito.jobs-service.schedulerChunkInMinutes=10
kogito.jobs-service.loadJobFromCurrentTimeIntervalInMinutes=5

#####################################
# Services definition 
#####################################
kogito.service.url=http://localhost:${quarkus.http.port}
kogito.data-index.url=http://localhost:${quarkus.http.port}

#####################################
# Security 
#####################################
quarkus.oidc.enabled=true
quarkus.smallrye-jwt.enabled=true
quarkus.smallrye-openapi.auto-add-bad-request-response=false
kogito.security.auth.enabled=true
kogito.security.auth.impersonation.allowed-for-roles=Managers

# Authorization - Enable authentication for all endpoints (dev-specific)
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.public.paths=/q/*,/docs/*,/q/oidc/.well-known/*
quarkus.http.auth.permission.public.policy=permit

# OIDC Configuration - Using .env variables like Kogito example
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.discovery-enabled=true
quarkus.oidc.tenant-enabled=true
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=service

#####################################
# Logging
#####################################
quarkus.log.level=INFO
quarkus.log.category."com.example".level=INFO
quarkus.log.category."com.example.bamoe.events".level=DEBUG
quarkus.log.category."com.example.bamoe.filter.TaskLifecycleFilter".level=INFO
# quarkus.log.category."org.jbpm".level=DEBUG
# quarkus.log.category."org.kie.kogito".level=DEBUG
# quarkus.log.category."com.example".level=DEBUG

# OIDC and Security Logging - Disabled verbose authentication logs
quarkus.log.category."io.quarkus.oidc".level=WARN
quarkus.log.category."io.quarkus.oidc.client".level=WARN
quarkus.log.category."io.quarkus.oidc.client.filter".level=WARN
quarkus.log.category."io.quarkus.security".level=WARN
quarkus.log.category."io.quarkus.smallrye.jwt".level=WARN
quarkus.log.category."io.smallrye.jwt".level=WARN
quarkus.log.category."org.jboss.resteasy.client".level=WARN

