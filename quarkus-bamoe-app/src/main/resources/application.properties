#####################################
# Enquiry Service REST Client Configuration
#####################################
quarkus.rest-client.enquiry-service.url=${ENQUIRY_SERVICE_URL}
quarkus.rest-client.enquiry-service.connect-timeout=30000
quarkus.rest-client.enquiry-service.read-timeout=30000

# Jackson Configuration for Date Handling
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.write-durations-as-timestamps=false

